      // Defensive fix for iframe/sandbox environments where window.fetch has only a getter
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If window is restricted, silently ignore
        }
      })();
    </script>
